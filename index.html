<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        width: 160px;
      }

      textarea {
        width: 100%;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <p style="font-weight: bold">변경 후 새로고침 해주세요</p>

    <label style="display: block; margin-bottom: 10px">
      <input type="checkbox" id="enable" />
      기능 활성화
    </label>

    <hr />

    <div style="margin: 12px 0">
      <strong>이미지 차단 모드</strong>
      <div style="margin-top: 8px">
        <label>
          <input type="radio" name="mode" value="all" />
          모든 사이트 차단
        </label>
        <br />
        <label>
          <input type="radio" name="mode" value="block-only" />
          특정 사이트만 차단
        </label>
        <br />
        <label>
          <input type="radio" name="mode" value="allow-only" />
          특정 사이트만 허용
        </label>
      </div>
    </div>

    <hr />

    <div style="margin-top: 10px">
      <strong>화이트리스트 (한 줄에 하나씩)</strong>
      <textarea
        id="whitelist"
        style="width: 100%; height: 80px; margin-top: 5px"
      ></textarea>
    </div>

    <div style="margin-top: 10px">
      <strong>블랙리스트 (한 줄에 하나씩)</strong>
      <textarea
        id="blacklist"
        style="width: 100%; height: 80px; margin-top: 5px"
      ></textarea>
    </div>
  </body>

  <script src="/scripts/index.js"></script>
</html>
